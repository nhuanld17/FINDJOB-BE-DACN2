<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff;
                border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">

    <h2 style="color: #333333;">Verify your email</h2>
    <p style="color: #666666;">Hi <span th:text="${username}">User</span>,</p>
    <p style="color: #666666;">Your OTP code is:</p>

    <div style="font-size: 36px; font-weight: bold; letter-spacing: 12px;
                    color: #01696f; margin: 24px 0;">
        <span th:text="${otp}">000000</span>
    </div>

    <p style="color: #666666;">
        This code will expire in
        <strong th:text="${expireMinutes}">5</strong> minutes.
    </p>
    <p style="color: #999999; font-size: 12px;">
        If you did not request this, please ignore this email.
    </p>
</div>
</body>
</html>
