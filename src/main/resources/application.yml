server:
  forward-headers-strategy: framework

spring:
  application:
    name: boilerplate

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 1000ms
      connect-timeout: 2000ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google

  flyway:
    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${ACCESS_TOKEN_LIFETIME}
  refresh-token-expiration-ms: ${REFRESH_TOKEN_LIFETIME}

app:
  oauth2:
    # Fix #10: Default :5173 (Vite dev server) — khớp CorsConfig
    redirect-url: ${APP_OAUTH2_REDIRECT_URL:http://localhost:5173/oauth-callback}
