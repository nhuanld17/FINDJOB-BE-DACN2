server:
  # Khi chạy sau reverse proxy (Nginx/Cloudflare): proxy chèn header X-Forwarded-Proto/Host
  # để Spring biết scheme/host thật của client. 'framework' = Spring tự đọc các header này.
  # BẮT BUỘC vì OAuth2 redirect-uri dùng "{baseUrl}" (tính động từ request) -
  # không có config này sẽ tính ra http:// (sai), Google báo redirect_uri_mismatch.
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      # kích thước tối đa của 1 file upload
      max-file-size: 10MB
      # kích thước tối đa của 1 request multipart/form-data
      max-request-size: 10MB

  application:
    name: boilerplate

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # ===== HikariCP Connection Pool =====
    hikari:
      pool-name: FindJobPool
      # Tối đa 10 connections đồng thời (phù hợp với ứng dụng vừa)
      maximum-pool-size: 10
      # Luôn giữ 2 connections sẵn sàng
      minimum-idle: 2
      # 30 giây timeout nếu không lấy được connection khả dụng
      connection-timeout: 30000
      # Connection chết nếu idle quá 5 phút (giải phóng tài nguyên)
      idle-timeout: 300000
      # Connection tối đa sống 30 phút
      max-lifetime: 1800000
      # Câu lệnh test connection trước khi dùng
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: 1000ms
      connect-timeout: 2000ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google

  flyway:
    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    baseline-on-migrate: true

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.1

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${ACCESS_TOKEN_LIFETIME}
  refresh-token-expiration-ms: ${REFRESH_TOKEN_LIFETIME}

app:
  oauth2:
    # khớp CorsConfig
    redirect-url: ${APP_OAUTH2_REDIRECT_URL:http://localhost:5173/oauth-callback}
    # Danh sách scheme mobile được phép nhận redirect kèm ticket, phân cách bằng dấu phẩy.
    # Production CHỈ có findjob://. exp:// là scheme của Expo Go
    allowed-mobile-schemes: ${APP_OAUTH2_ALLOWED_MOBILE_SCHEMES:findjob://}

  # ===== Seed dữ liệu job (chỉ dùng khi dev/test) =====
  # JobDataSeeder (CommandLineRunner) — seed job + job_categories cho các
  # công ty CHƯA có job (idempotent, chạy mỗi lần start app).
  # Bật lên khi cần dữ liệu để test keyset pagination, tắt đi khi không cần.
  seed-jobs:
    enabled: ${SEED_JOBS_ENABLED:true}   # true = chạy seeder khi start app
    per-company: ${SEED_JOBS_PER_COMPANY:45}  # số job seed cho mỗi công ty chưa có job

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
